<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CUCK FLY — graphics generator</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body{background:#111;color:#ccc;font:13px monospace;padding:20px}
  canvas{display:block;margin:14px 0;max-width:100%;border:1px solid #333}
</style>
</head>
<body>
<div id="log">loading font…</div>
<canvas id="banner" width="1500" height="500"></canvas>
<canvas id="og" width="1200" height="630"></canvas>
<canvas id="pfp" width="400" height="400"></canvas>
<canvas id="pfpcrop" width="400" height="400"></canvas>
<canvas id="bansafe" width="1500" height="500"></canvas>
<script src="../js/flyart.js"></script>
<script>
var TAU = 6.2831853;

/* ---------- shared scene bits ---------- */
function bg(ctx, W, H, tilt) {
  ctx.fillStyle = '#05030a';
  ctx.fillRect(0, 0, W, H);
  var g = ctx.createRadialGradient(W * 0.63, H * 0.50, 8, W * 0.63, H * 0.52, W * 0.46);
  g.addColorStop(0, '#5f1f72');
  g.addColorStop(0.34, '#3a1044');
  g.addColorStop(0.68, '#1a0820');
  g.addColorStop(1, '#07040c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  /* cold pool where the chair sits */
  var c = ctx.createRadialGradient(W * 0.86, H * 0.66, 6, W * 0.86, H * 0.66, W * 0.3);
  c.addColorStop(0, 'rgba(24,90,70,.5)');
  c.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = c; ctx.fillRect(0, 0, W, H);
  /* vignette */
  var v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  /* scanlines, very light */
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  for (var y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
}

/* three pixel hearts in a loose arc, the way theirs sit over the couple */
function hearts(ctx, x, y, s, n, col) {
  var lay = [[-0.62, 0.10, 0.030], [0.02, -0.16, 0.036], [0.64, 0.06, 0.028],
             [-0.28, -0.40, 0.022], [0.40, -0.44, 0.020]];
  for (var i = 0; i < n && i < lay.length; i++) {
    FlyArt.pixelHeart(ctx, x + lay[i][0] * s, y + lay[i][1] * s, Math.max(1, s * lay[i][2]), col, true);
  }
}

/* couple + chair, positioned inside a box */
function scene(ctx, cx, cy, s, opts) {
  opts = opts || {};
  /* the couple */
  FlyArt.shadow(ctx, cx - s * 0.1, cy + s * 0.5, s * 1.25, s * 0.2, 0.55);
  FlyArt.drawFly(ctx, { x: cx, y: cy, s: s, phase: 0.6, tilt: 0.03 });
  FlyArt.drawFly(ctx, {
    x: cx - s * 0.02, y: cy - s * 0.55, s: s * 0.9, phase: 1.9,
    tilt: 0.12, legLift: 0.55, wingBeat: 1.1
  });
  hearts(ctx, cx + s * 0.15, cy - s * 1.12, s, 5, '#ff4f9a');

  /* the chair, to the right */
  if (opts.chair !== false) {
    var ox = cx + s * (opts.gap || 2.5), oy = cy + s * 0.06, cs = s * 1.2;
    FlyArt.shadow(ctx, ox, oy + cs * 0.8, cs * 1.35, cs * 0.22, 0.6);
    FlyArt.drawChair(ctx, ox, oy, cs, 'rgba(125,255,196,.3)');
    FlyArt.drawFly(ctx, {
      x: ox + cs * 0.10, y: oy - cs * 0.34, s: s * 0.86,
      phase: 2.2, seated: 1, tilt: 0.3, headTilt: -0.2, tint: 0.6, flip: true
    });
    /* one green heart, cracked down the middle */
    hearts(ctx, ox + cs * 0.05, oy - cs * 1.82, s * 0.7, 2, '#7dffc4');
  }
}

/* pixel title with a chromatic glow, like an old arcade marquee */
function title(ctx, text, x, y, size, align) {
  ctx.save();
  ctx.font = size + 'px "Press Start 2P", monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,60,170,.85)'; ctx.shadowBlur = size * 0.75;
  ctx.fillStyle = '#ff2f9f'; ctx.fillText(text, x, y);
  ctx.shadowBlur = size * 0.35;
  ctx.fillStyle = '#ff77c8'; ctx.fillText(text, x, y);
  /* green fringe, offset — the third one is always slightly out of frame */
  ctx.shadowColor = 'rgba(125,255,196,.6)'; ctx.shadowBlur = size * 0.5;
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#7dffc4'; ctx.fillText(text, x + size * 0.055, y + size * 0.045);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff2fa'; ctx.fillText(text, x - size * 0.02, y - size * 0.02);
  ctx.restore();
}

function line(ctx, text, x, y, size, col, weight, align) {
  ctx.save();
  ctx.font = (weight || 600) + ' ' + size + 'px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
  ctx.textAlign = align || 'left';
  ctx.fillStyle = col;
  ctx.fillText(text, x, y);
  ctx.restore();
}

/* ---------- the three deliverables ---------- */
/* X header: 1500x500. Everything that matters stays inside the safe box —
   the sides get trimmed on narrow screens and the avatar sits over the
   bottom-left corner, so nothing important goes there. */
var SAFE = { x0: 200, x1: 1330, y0: 80, y1: 430 };
var AVATAR = { x: 150, y: 500, r: 128 };   /* the profile picture overlaps here */

function drawBanner() {
  var cv = document.getElementById('banner'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  bg(ctx, W, H);
  scene(ctx, 880, 310, 86, { gap: 3.1 });
  title(ctx, 'CUCK FLY', SAFE.x0 + 22, 200, 52);
  line(ctx, 'three whole fly brains, live', SAFE.x0 + 24, 268, 27, '#ffffff', 700);
  line(ctx, 'two of them fucking · one of them watching', SAFE.x0 + 24, 312, 18, '#b39ec0', 500);
  line(ctx, 'buys make them go harder · his turn never comes', SAFE.x0 + 24, 352, 16, '#7d6b8c', 500);
  post('banner', cv);
  safePreview(cv);
}

/* overlay of what X eats, so the layout can be checked rather than hoped at */
function safePreview(src) {
  var cv = document.getElementById('bansafe'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(src, 0, 0);
  ctx.fillStyle = 'rgba(255,0,0,.3)';
  ctx.fillRect(0, 0, SAFE.x0, H); ctx.fillRect(SAFE.x1, 0, W - SAFE.x1, H);
  ctx.fillRect(SAFE.x0, 0, SAFE.x1 - SAFE.x0, SAFE.y0);
  ctx.fillRect(SAFE.x0, SAFE.y1, SAFE.x1 - SAFE.x0, H - SAFE.y1);
  ctx.fillStyle = 'rgba(255,220,0,.45)';
  ctx.beginPath(); ctx.arc(AVATAR.x, AVATAR.y, AVATAR.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#0ff'; ctx.lineWidth = 3;
  ctx.strokeRect(SAFE.x0, SAFE.y0, SAFE.x1 - SAFE.x0, SAFE.y1 - SAFE.y0);
  post('banner_safe', cv);
}

function drawOg() {
  var cv = document.getElementById('og'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  bg(ctx, W, H);
  scene(ctx, W * 0.33, H * 0.80, H * 0.145, { gap: 3.1 });
  title(ctx, 'CUCK FLY', W / 2, H * 0.235, 58, 'center');
  line(ctx, 'three whole fly brains, live', W / 2, H * 0.335, 28, '#ffffff', 700, 'center');
  line(ctx, 'two of them are fucking. the third one is in the chair.', W / 2, H * 0.405, 20, '#b39ec0', 500, 'center');
  line(ctx, 'cuckfly.tech', W - 44, H * 0.955, 18, '#7dffc4', 600, 'right');
  post('og', cv);
}

function drawPfp() {
  var cv = document.getElementById('pfp'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  /* violet ground, same family as the couple's own avatar */
  ctx.fillStyle = '#07040c'; ctx.fillRect(0, 0, W, H);
  var g = ctx.createRadialGradient(W * 0.46, H * 0.42, 8, W * 0.5, H * 0.5, W * 0.78);
  g.addColorStop(0, '#7a2c93'); g.addColorStop(0.34, '#4c1557');
  g.addColorStop(0.7, '#200a28'); g.addColorStop(1, '#07040c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* everything lives inside the circle X crops to: r = 0.47 * W from centre */
  var s = H * 0.23, gx = W * 0.315, gy = H * 0.47;

  /* the couple */
  FlyArt.shadow(ctx, gx - s * 0.1, gy + s * 0.52, s * 1.2, s * 0.2, 0.5);
  FlyArt.drawFly(ctx, { x: gx, y: gy, s: s, phase: 0.6, tilt: 0.03 });
  FlyArt.drawFly(ctx, {
    x: gx - s * 0.03, y: gy - s * 0.56, s: s * 0.9, phase: 1.9,
    tilt: 0.12, legLift: 0.55, wingBeat: 1.1
  });
  hearts(ctx, gx + s * 0.16, gy - s * 1.3, s * 0.92, 3, '#ff4f9a');

  /* the one watching — big enough to read, and well inside the crop */
  var cfs = H * 0.175, cs = cfs * 1.24, cx = W * 0.72, cy = H * 0.715;
  var hg = ctx.createRadialGradient(cx - cs * 0.3, cy - cs * 0.5, 2, cx - cs * 0.3, cy - cs * 0.5, cs * 1.5);
  hg.addColorStop(0, 'rgba(80,255,190,.26)'); hg.addColorStop(1, 'rgba(80,255,190,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
  FlyArt.shadow(ctx, cx, cy + cs * 0.78, cs * 1.25, cs * 0.2, 0.5);
  ctx.save();
  ctx.globalAlpha = 0.72;
  FlyArt.drawChair(ctx, cx, cy, cs, null);
  ctx.restore();
  FlyArt.drawFly(ctx, {
    x: cx + cs * 0.08, y: cy - cs * 0.34, s: cfs,
    phase: 2.2, seated: 1, tilt: 0.3, headTilt: -0.22, tint: 0.6, flip: true
  });
  hearts(ctx, cx + cs * 0.05, cy - cs * 1.5, cfs * 0.7, 2, '#7dffc4');

  /* vignette: the two red eyes and the one green eye are what survives at 48px */
  var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.68);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.66)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  post('pfp', cv);
  cropPreview(cv);
}

/* what X actually shows: the inscribed circle */
function cropPreview(src) {
  var cv = document.getElementById('pfpcrop'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#15181d'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.beginPath(); ctx.arc(W / 2, H / 2, W / 2, 0, TAU); ctx.clip();
  ctx.drawImage(src, 0, 0);
  ctx.restore();
  post('pfp_crop', cv);
}

function post(name, cv) {
  fetch('http://127.0.0.1:8898/' + name, { method: 'POST', body: cv.toDataURL('image/png') });
}

document.fonts.load('40px "Press Start 2P"').then(function () {
  return document.fonts.ready;
}).then(function () {
  drawBanner(); drawOg(); drawPfp();
  document.getElementById('log').textContent = 'rendered + posted';
});
</script>
</body>
</html>
